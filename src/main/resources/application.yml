server:
  port: 8086

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/notifications_db
    username: ${DB_USER:cinema}
    password: ${DB_PASSWORD:cinema}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  # Locally: Mailpit from docker-compose (see mails at http://localhost:8025)
  # Production: e.g. Postmark smtp.postmarkapp.com:587 or SES email-smtp.eu-west-1.amazonaws.com:587
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}

app:
  mail:
    from: ${MAIL_FROM:no-reply@cinema.local}
  sms:
    enabled: false   # Twilio is optional / not wired yet

management:
  endpoints:
    web:
      exposure:
        include: health,info
