server:
  port: 8086

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notifications_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # Each consumer (max 10) uses 2 connections: the inbox transaction + the send-log writes
      maximum-pool-size: 25

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    # Run schema.sql after Hibernate has created the tables (partial indexes Hibernate cannot make)
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # Locally: Mailpit from docker-compose (see mails at http://localhost:8025)
  # Production: e.g. Postmark smtp.postmarkapp.com:587 or SES email-smtp.eu-west-1.amazonaws.com:587
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Retries wait inside the consumer thread, so use a few consumers –
        # otherwise one event being retried would hold up all the others.
        concurrency: 3
        max-concurrency: 10
        # A message that still fails after the retries is NOT put back on the queue,
        # it is dead-lettered (see RabbitConfig) instead.
        default-requeue-rejected: false
        retry:
          # Retry with backoff: 2s, 4s, 8s, 16s -> then FAILED + dead-letter queue
          enabled: true
          max-retries: 4
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s

app:
  rabbitmq:
    exchange: cinema.events
    queue: notification-service.events
    dead-letter-exchange: cinema.events.dlx
    dead-letter-queue: notification-service.events.dlq
  mail:
    from: ${MAIL_FROM:no-reply@bioflix.local}
  sms:
    enabled: ${SMS_ENABLED:true}   # Twilio is optional / not wired yet

management:
  endpoints:
    web:
      exposure:
        include: health,info
