# Local development environment for notification-service.
#   docker compose up --build
#
#   API:                 http://localhost:8086/api/notifications/me   (header X-User-Id)
#   RabbitMQ UI:         http://localhost:15672   (guest / guest)
#   Mailpit (the inbox): http://localhost:8025
#   Postgres:            localhost:5434  (postgres / postgres, db notifications_db)
#
# Every host port can be changed if it is already in use, e.g.
#   MAILPIT_UI_PORT=8026 MAILPIT_SMTP_PORT=1026 docker compose up --build
services:
  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notifications_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${NOTIFICATION_DB_PORT:-5434}:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web inbox

  notification-service:
    build: .
    ports:
      - "${NOTIFICATION_PORT:-8086}:8086"
    environment:
      DB_HOST: notification-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SMS_ENABLED: ${SMS_ENABLED:-false}
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  notification-db-data:
